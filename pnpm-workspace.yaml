# The @gorhom/bottom-sheet fork depends on the @gorhom/portal fork by git
# commit. pnpm 9+ refuses git-hosted subdependencies unless this is off.
blockExoticSubdeps: false

packages:
  # flama:begin e2e
  - "e2e"
  # flama:end e2e
  # flama:begin qa
  - "qa"
  # flama:end qa
  - "apps/*"
  - "packages/*"
  # flama:begin runner
  - "packages/go/*"
  # flama:end runner
  - "packages/backend/*"
  - "packages/frontend/*"
  - "packages/frontend/design-system/*"
