name: Scorecard

# OpenSSF Scorecard: grades the repository's supply-chain practices (pinned
# actions, token permissions, branch protection, dependency updates) and
# files what it finds under Security → Code scanning. Informational, never a
# required check. Scorecard publishes to its public API, which only works for
# a public repository; a private project skips the job.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  branch_protection_rule:
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard
    runs-on: ubuntu-latest
    if: github.event.repository.private == false
    permissions:
      # Upload the SARIF to code scanning, and sign the published result.
      security-events: write
      id-token: write
    steps:
      # Records every outbound call the job makes; audit only, it blocks
      # nothing. GitHub-hosted runners only, which is why the gha-vm jobs in
      # ci.yml do not carry it.
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
