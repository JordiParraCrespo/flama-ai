name: CI

# What runs is decided by scripts/ci/affected.mjs; scripts/ci/README.md is
# the whole picture. The steps of the Check job after `scope` are also what
# `pnpm ci:local` runs, read from this file, so each one is a plain `run:`
# over $AFFECTED_PACKAGES / $AFFECTED_FILTERS — no `if:`, no expressions.
# The `CI` job at the end is the one check to require.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # `ready_for_review` because a draft skips CI: its author iterates locally.
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: gha-vm
    if: github.event.pull_request.draft != true
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
      packages: ${{ steps.scope.outputs.packages }}
      images: ${{ steps.scope.outputs.images }}
    # One job rather than one per concern: every job pays a checkout, a
    # toolchain and an install before it does anything, which on a pull request
    # cost more than the checks themselves.
    steps:
      # The whole history, so Turborepo can diff a pull request against its
      # base branch. The repository is small enough for this to cost seconds.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      # flama:begin runner
      # Turborepo builds, tests and checks the Go modules through their
      # package.json scripts, so the toolchain has to be present.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.work
          cache-dependency-path: |
            apps/runner/go.sum
            packages/go/*/go.sum
      # flama:end runner
      - run: pnpm install --frozen-lockfile
      # Which packages this run touches and which images it builds. A push to
      # main, or a change to a file no package owns (this workflow, the
      # lockfile, docker/), runs everything; see the script. Every step below
      # is `pnpm ci:local`'s too.
      - id: scope
        run: node scripts/ci/affected.mjs
      # `biome ci` fails on anything unformatted or unfixed; `pnpm check`
      # writes the fixes instead, which is what a contributor runs.
      - name: Biome
        run: pnpm exec biome ci .
      # The repo's own GritQL lint plugins, over their fixtures.
      - run: pnpm check:biome-plugins
      # flama:begin web|web-showcase|mobile|mobile-showcase
      # The design-system linter (`@shadcn/lint` through oxlint, scoped to its
      # own rules — Biome keeps correctness) over every web and mobile app that
      # has a `lint:design` script. Every rule is at `warn` while the findings
      # it inherited are worked off, so this step reports and never fails;
      # promote a rule to `error` in the design system's oxlint.design.json
      # once it is clean.
      - name: Design-system lint
        run: pnpm lint:design
      # flama:end web|web-showcase|mobile|mobile-showcase
      # flama:plugins design-lint
      # The API module contract: the closed set of layer directories, the file
      # names each admits, use-case slice completeness and the line caps.
      # Import rules are dependency-cruiser's, below.
      - name: API structure
        run: pnpm check:api-structure
      # flama:begin web|mobile
      # The frontend layout contract: feature names, kind directories, the
      # route line cap, no copies of what a kit ships, and the docs every
      # package carries. Import rules are dependency-cruiser's, below.
      - name: Frontend structure
        run: pnpm check:structure
      # flama:end web|mobile
      # flama:plugins frontend-structure
      # Every flag in the catalog is read somewhere, and no temporary flag is
      # past its expiry date — flags are debt with a due date, and this is
      # where it falls due.
      - name: Feature flags
        run: pnpm check:flags
      # The marker grammar in `scripts/lib/`, which outlives a prune.
      - name: Repo scripts
        run: pnpm test:scripts
      # The feature manifest must keep describing the repo: every optional app
      # referenced only inside its own paths or a marker block. It outlives
      # initialisation, because removing a plugin is a prune.
      - name: Starter manifest
        run: pnpm starter:check
      # The filters name the affected packages; `dependsOn: ["^build"]` still
      # builds what they import. Empty on main, where everything runs — and
      # empty filters mean "every package" to Turborepo, so an empty affected
      # list has to skip the step rather than pass nothing.
      - name: Build
        run: |
          [[ "$AFFECTED_PACKAGES" == '[]' ]] || pnpm turbo run build $AFFECTED_FILTERS
      # After the build, whose outputs dependency-cruiser resolves the
      # @flama/* imports through.
      - name: Architecture boundaries
        run: |
          [[ "$AFFECTED_PACKAGES" == '[]' ]] || pnpm turbo run arch $AFFECTED_FILTERS
      - name: Unit tests
        run: |
          [[ "$AFFECTED_PACKAGES" == '[]' ]] || pnpm turbo run test $AFFECTED_FILTERS
      # flama:begin runner
      # `go test` and `go build` ran above as the modules' Turborepo tasks;
      # the linters are the part with no package script. The gha-vm runners
      # ship no C compiler, and -race needs cgo; run the race detector locally
      # (make test-race).
      - name: Go vet and lint
        run: |
          [[ "$AFFECTED_PACKAGES" == *'"@flama/go-'* || "$AFFECTED_PACKAGES" == *'"@flama/runner"'* ]] || exit 0
          # The workspace root is not a module, so `./...` does not resolve
          # there; the module-path pattern spans every module in go.work.
          go vet github.com/jordiparracrespo/flama-ai/...
          # A runner installs the pinned linter; a workstation is asked to.
          if ! command -v golangci-lint > /dev/null; then
            if [[ -z "${GITHUB_ACTIONS:-}" ]]; then
              echo "golangci-lint is not installed: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.5.0"
              exit 1
            fi
            curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b "$(go env GOPATH)/bin" v2.5.0
          fi
          # golangci-lint needs directory patterns, one per module; `go list -m`
          # in workspace mode lists exactly the modules go.work declares.
          golangci-lint run $(go list -m -f '{{.Dir}}/...')
      # flama:end runner
      # flama:begin web
      # What a first-time visitor downloads before anything renders, against a
      # committed budget. Vite's own chunk warning prints and passes.
      #
      # `check:bundle` reads every SPA's dist folder at once, so each one that
      # changed is built first — the one already built above is a cache hit.
      # Which SPAs those are is decided inside the block, next to the filter
      # that builds them, so a plugin that adds an SPA adds both in one place.
      - name: First-load budgets
        run: |
          changed() { [[ "$AFFECTED_PACKAGES" == *"\"$1\""* ]]; }
          filters=()
          # flama:begin web
          if changed @flama/web; then filters+=(--filter=@flama/web); fi
          # flama:end web
          # flama:plugins admin-web
          if [[ ${#filters[@]} -eq 0 ]]; then exit 0; fi
          pnpm turbo run build "${filters[@]}"
          pnpm check:bundle
      # flama:end web
      # flama:plugins bundle-budgets

  test-integration:
    name: Integration Tests
    runs-on: gha-vm
    needs: check
    # apps/api is the only package with an integration suite, and Turborepo's
    # affected list already includes it whenever one of its dependencies moved.
    if: contains(needs.check.outputs.packages, '"@flama/api"')
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      # flama:begin runner
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.work
          cache-dependency-path: |
            apps/runner/go.sum
            packages/go/*/go.sum
      # flama:end runner
      - run: pnpm install --frozen-lockfile
      # Only the API and what it imports; the full build spent most of its
      # two minutes on apps this job never runs.
      - run: pnpm turbo run build --filter=@flama/api...
      - run: pnpm test:integration

  # flama:begin e2e
  test-e2e:
    name: End-to-End Tests (API)
    runs-on: gha-vm
    needs: check
    # The suite drives the API over HTTP and depends on nothing else in the
    # workspace, so it runs when the API (or one of its dependencies, which
    # the affected list folds into it) or the suite itself changed.
    if: contains(needs.check.outputs.packages, '"@flama/api"') || contains(needs.check.outputs.packages, '"@flama/e2e"')
    # The same Postgres and Redis `pnpm docker:up` starts locally, as service
    # containers: this runner has the Docker daemon but not the `docker
    # compose` plugin, and the ports and credentials below are the ones
    # docker/docker-compose.dev.yml and .env.example already agree on.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: flama
          POSTGRES_PASSWORD: flama
          POSTGRES_DB: flama
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flama"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    # Pinned rather than left to `playwright.config.ts`'s defaults, which read
    # these names from the environment — generic enough for a self-hosted runner
    # to already define, and `WEB_URL` is the `Origin` every request context
    # sends, which Better Auth checks against `trustedOrigins`. Same values as
    # the defaults; the point is that the runner cannot change them.
    env:
      API_URL: http://localhost:3001
      WEB_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The suite reads verification and reset tokens out of Postgres and the
      # API log rather than a mailbox, which is what `EMAIL_PROVIDER=console`
      # in .env.example gives it. `support/db.ts` reads the same root .env as
      # the API, so both necessarily agree on the database.
      - run: cp .env.example .env
      # Only what the API needs: the `api` project drives HTTP, so there is no
      # browser and no web build in this job — and therefore no Go toolchain
      # either, since nothing here reaches apps/runner.
      - run: pnpm turbo run build --filter=@flama/api...
      - run: pnpm --filter @flama/api migration:run
      - name: Start the API
        run: |
          node apps/api/dist/main.js > /tmp/api.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf http://localhost:3001/api/v1/health > /dev/null && exit 0
            sleep 1
          done
          echo "API never became healthy"; cat /tmp/api.log; exit 1
      # The origins Better Auth will trust, as the API process resolves them —
      # `@flama/env` lets a real environment variable win over the root .env, so
      # a runner that defines one of these generic names silently changes the
      # trusted set. Printed always, not just on failure: it is one line and it
      # is the first thing worth knowing when an auth route answers 403.
      - name: Resolved origins
        run: |
          pnpm --filter @flama/e2e exec node -e "require('@flama/env/load');console.log(JSON.stringify({FRONTEND_URL:process.env.FRONTEND_URL,BETTER_AUTH_URL:process.env.BETTER_AUTH_URL,NODE_ENV:process.env.NODE_ENV,API_URL:process.env.API_URL,WEB_URL:process.env.WEB_URL},null,2))"
      - run: pnpm --filter @flama/e2e e2e:api
      # The API log is this suite's mailbox, and it is also where Better Auth
      # writes why it refused a request. Grepped rather than tailed: the first
      # spec is the one that fails, so its request is at the top of a two-minute
      # log. The token is stripped before printing — what matters is the rest of
      # the query, and `/verify-email` answers 403 for exactly one reason, an
      # untrusted `callbackURL`.
      - name: What the API saw
        if: failure()
        run: |
          echo "--- verification links (token stripped)"
          grep -o 'verify-email?[^ ]*' /tmp/api.log | sed 's/token=[^&]*/token=REDACTED/' | sort -u | head -n 5
          echo "--- refusals"
          grep -nE 'Invalid (callbackURL|origin|redirectURL)|Current list of trustedOrigins|Better Auth' /tmp/api.log | head -n 20
          echo "--- api log (head)"
          head -n 60 /tmp/api.log
  # flama:end e2e

  build-images:
    name: Build Docker Images
    runs-on: gha-vm
    needs:
      - check
      - test-integration
      # flama:begin e2e
      - test-e2e
      # flama:end e2e
    # `needs` alone would skip this job whenever one of the test jobs was
    # skipped for having nothing to do; wait for them all, then require that
    # none failed and that some image is selected at all. `check` has to have
    # succeeded outright: skipped (a draft), its outputs are empty, not `[]`.
    # The selection is event-gated; see selectImages in the script.
    if: |
      !cancelled()
      && needs.check.result == 'success'
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
      && needs.check.outputs.images != '[]'
    permissions:
      contents: read
      packages: write
    strategy:
      # The apps whose package (or a dependency of it) changed, from the
      # mapping in scripts/ci/affected.mjs, as selectImages narrows them.
      matrix:
        app: ${{ fromJSON(needs.check.outputs.images) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Lowercase repository name
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          # Consumed by the Go runner image (embedded as the reported
          # version); the Node images ignore it.
          build-args: |
            VERSION=${{ github.sha }}
          tags: |
            ghcr.io/${{ env.REPO_LC }}/flama-${{ matrix.app }}:latest
            ghcr.io/${{ env.REPO_LC }}/flama-${{ matrix.app }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The one check branch protection needs to require. It fails closed: Check
  # must have succeeded, and every other job succeeded or had nothing to do
  # (skipped). A draft skips this job too, so it never reports green for a
  # run that did nothing.
  ci:
    name: CI
    runs-on: gha-vm
    if: always() && github.event.pull_request.draft != true
    needs:
      - check
      - test-integration
      # flama:begin e2e
      - test-e2e
      # flama:end e2e
      - build-images
    steps:
      - name: Check passed, every other job passed or had nothing to do
        env:
          CHECK: ${{ needs.check.result }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "check: $CHECK; all: $RESULTS"
          [[ "$CHECK" == success ]] || exit 1
          for result in $RESULTS; do
            [[ "$result" == success || "$result" == skipped ]] || exit 1
          done
