name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: gha-vm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      # `pnpm arch` runs through Turborepo, whose ^build edge now reaches
      # the Go packages, so the toolchain has to be present here as well.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.work
          cache-dependency-path: |
            apps/runner/go.sum
            packages/go/*/go.sum
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Architecture boundaries
        run: pnpm arch

  go:
    name: Go (go.work)
    runs-on: gha-vm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.work
          cache-dependency-path: |
            apps/runner/go.sum
            packages/go/*/go.sum
      # The workspace root is not a module, so `./...` does not resolve
      # there; the module-path pattern spans every module in go.work.
      - run: go vet github.com/jordiparracrespo/flama-ai/...
      # golangci-lint needs directory patterns, one per module; `go list -m`
      # in workspace mode lists exactly the modules go.work declares.
      - run: curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b "$(go env GOPATH)/bin" v2.5.0
      - run: golangci-lint run $(go list -m -f '{{.Dir}}/...')
      # The gha-vm runners ship no C compiler, and -race needs cgo; run the
      # race detector locally (make test-race) and plain tests here.
      - run: go test -count=1 github.com/jordiparracrespo/flama-ai/...
      - run: go build -trimpath ./cmd/server
        working-directory: apps/runner

  test:
    name: Test
    runs-on: gha-vm
    needs: lint
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      # Turborepo builds and tests apps/runner through its package.json
      # scripts, so the Go toolchain has to be present here too.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.work
          cache-dependency-path: |
            apps/runner/go.sum
            packages/go/*/go.sum
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      # What a first-time visitor downloads before anything renders, against a
      # committed budget. Vite's own chunk warning prints and passes.
      - name: First-load budgets
        run: pnpm check:bundle

  test-integration:
    name: Integration Tests
    runs-on: gha-vm
    needs: lint
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.work
          cache-dependency-path: |
            apps/runner/go.sum
            packages/go/*/go.sum
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:integration

  test-e2e:
    name: End-to-End Tests (API)
    runs-on: gha-vm
    needs: lint
    # The same Postgres and Redis `pnpm docker:up` starts locally, as service
    # containers: this runner has the Docker daemon but not the `docker
    # compose` plugin, and the ports and credentials below are the ones
    # docker/docker-compose.dev.yml and .env.example already agree on.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: flama
          POSTGRES_PASSWORD: flama
          POSTGRES_DB: flama
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flama"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The suite reads verification and reset tokens out of Postgres and the
      # API log rather than a mailbox, which is what `EMAIL_PROVIDER=console`
      # in .env.example gives it. `support/db.ts` reads the same root .env as
      # the API, so both necessarily agree on the database.
      - run: cp .env.example .env
      # Only what the API needs: the `api` project drives HTTP, so there is no
      # browser and no web build in this job — and therefore no Go toolchain
      # either, since nothing here reaches apps/runner.
      - run: pnpm turbo run build --filter=@flama/api...
      - run: pnpm --filter @flama/api migration:run
      - name: Start the API
        run: |
          node apps/api/dist/main.js > /tmp/api.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf http://localhost:3001/api/v1/health > /dev/null && exit 0
            sleep 1
          done
          echo "API never became healthy"; cat /tmp/api.log; exit 1
      - run: pnpm --filter @flama/e2e e2e:api

  build-images:
    name: Build Docker Images
    runs-on: gha-vm
    needs: [test, test-integration, test-e2e, go]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [api, web, admin-web, docs, mcp, runner]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Lowercase repository name
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          # Consumed by apps/runner (embedded as the reported version);
          # the Node images ignore it.
          build-args: |
            VERSION=${{ github.sha }}
          tags: |
            ghcr.io/${{ env.REPO_LC }}/flama-${{ matrix.app }}:latest
            ghcr.io/${{ env.REPO_LC }}/flama-${{ matrix.app }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
