name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: gha-vm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Architecture boundaries
        run: pnpm arch

  go:
    name: Go (apps/runner)
    runs-on: gha-vm
    defaults:
      run:
        working-directory: apps/runner
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: apps/runner/go.mod
          cache-dependency-path: apps/runner/go.sum
      - run: go mod verify
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: v2.5
          working-directory: apps/runner
      - run: go test -race -count=1 ./...
      - run: go build -trimpath ./cmd/server

  test:
    name: Test
    runs-on: gha-vm
    needs: lint
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      # Turborepo builds and tests apps/runner through its package.json
      # scripts, so the Go toolchain has to be present here too.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: apps/runner/go.mod
          cache-dependency-path: apps/runner/go.sum
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

  test-integration:
    name: Integration Tests
    runs-on: gha-vm
    needs: lint
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: apps/runner/go.mod
          cache-dependency-path: apps/runner/go.sum
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:integration

  build-images:
    name: Build Docker Images
    runs-on: gha-vm
    needs: [test, test-integration, go]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [api, web, admin-web, docs, mcp, runner]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Lowercase repository name
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          # Consumed by apps/runner (embedded as the reported version);
          # the Node images ignore it.
          build-args: |
            VERSION=${{ github.sha }}
          tags: |
            ghcr.io/${{ env.REPO_LC }}/flama-${{ matrix.app }}:latest
            ghcr.io/${{ env.REPO_LC }}/flama-${{ matrix.app }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
