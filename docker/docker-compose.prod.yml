services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME:-flama}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-flama}
      POSTGRES_DB: ${DB_DATABASE:-flama}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-flama}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ${API_IMAGE:-ghcr.io/your-org/flama-api:latest}
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-flama}
      DB_PASSWORD: ${DB_PASSWORD:-flama}
      DB_DATABASE: ${DB_DATABASE:-flama}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      # flama:begin mobile
      MOBILE_SCHEME: ${MOBILE_SCHEME:-flama}
      # flama:end mobile
      # flama:plugins api-env
      # OAuth providers. The image does not ship the root `.env`, so anything
      # the API must read has to be forwarded here. Empty is the "not
      # configured" value — the provider simply stays off (see
      # GET /api/v1/health/capabilities).
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
    ports:
      - "3001:3001"

  # flama:begin web
  web:
    image: ${WEB_IMAGE:-ghcr.io/your-org/flama-web:latest}
    restart: always
    depends_on:
      - api
    # No runtime environment: the web image is a static Vite build served by
    # nginx — VITE_* values are baked in at image build time. The one runtime
    # knob is CSP_EXTRA_ORIGINS, the origins nginx's Content-Security-Policy
    # admits beyond 'self'. The image defaults it to the PostHog EU endpoints;
    # add it here only to widen that (another analytics region, or a
    # VITE_API_URL that is not this origin). Setting it replaces the default
    # rather than adding to it — see apps/web/nginx.conf.
    ports:
      - "3000:3000"
  # flama:end web

  # flama:plugins services

  # flama:begin runner
  runner:
    image: ${RUNNER_IMAGE:-ghcr.io/your-org/flama-runner:latest}
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      RUNNER_ENV: production
      RUNNER_PORT: 3006
      # Empty keeps the in-memory stores; set it to persist keys and jobs.
      # A separate database on the same server keeps the runner's tables out
      # of the API's schema.
      RUNNER_DATABASE_URL: ${RUNNER_DATABASE_URL:-}
      # Required. The API authenticates to the runner with this key or one
      # minted from it; nothing else in the stack needs to know it.
      RUNNER_BOOTSTRAP_API_KEY: ${RUNNER_BOOTSTRAP_API_KEY}
      # Empty keeps service tokens off (see GET /health/capabilities).
      RUNNER_JWT_SECRET: ${RUNNER_JWT_SECRET:-}
      ERROR_TYPE_BASE_URL: ${ERROR_TYPE_BASE_URL:-https://flama.dev/errors}
    # Not published: only the API (on the compose network) talks to it.
    expose:
      - "3006"
  # flama:end runner

volumes:
  postgres_data:
  redis_data:
