# Loads every dashboard in docker/monitoring/grafana/dashboards/ (mounted read-only
# at /var/lib/grafana/dashboards), so the repository stays their source of
# truth: an edit to the JSON shows up within the interval below, and an edit
# made in the UI is refused rather than lost on the next restart.
apiVersion: 1

providers:
  - name: flama
    folder: Flama
    type: file
    allowUiUpdates: false
    updateIntervalSeconds: 10
    options:
      path: /var/lib/grafana/dashboards
