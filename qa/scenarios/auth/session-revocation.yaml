id: AUTH-07
title: Signing out, and resetting a password, close every door they should
theme: auth
severity: high
fixture: reset
tags: [security, sessions]

coverage:
  primary:
    - session.revocation-on-sign-out
    - session.cookie-hardening
  secondary:
    - session.revocation-on-password-reset
    - auth.sign-out

intent: >-
  A session that outlives the act meant to end it is the quietest security bug
  there is: everything on screen says signed out. Both acts are checked against
  the session rows rather than against the screen, and the second device is a
  real second browser context rather than the same one reloaded.

docsRefs:
  - e2e/README.md
codeRefs:
  - apps/api/src/auth/auth.ts

preconditions:
  - 'The `reset` fixture, so the member can be created again.'

steps:
  - Sign in on two independent browser contexts.
  - Sign out on the first, and try its dashboard again.
  - Reset the password from the mail sink.
  - Try the second context's dashboard.

expected:
  - Sign-out removes the session row, not only the cookie.
  - The signed-out context can no longer open the dashboard.
  - After the reset, the other context is signed out too.
  - The session cookie is httpOnly, so a script on the page cannot read it.

artifacts:
  - auth-07-signed-out.png
  - auth-07-other-device-revoked.png
