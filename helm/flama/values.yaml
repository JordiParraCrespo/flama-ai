api:
  image: ghcr.io/your-org/flama-api:latest
  replicas: 1
  port: 3001
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  env:
    NODE_ENV: production
    BETTER_AUTH_URL: https://flama.dev
    FRONTEND_URL: https://flama.dev
    ADMIN_FRONTEND_URL: https://control.flama.dev
    MOBILE_SCHEME: flama
    ADMIN_MOBILE_SCHEME: flama-admin
    DB_HOST: flama-postgres
    DB_PORT: "5432"
    REDIS_HOST: flama-redis
    REDIS_PORT: "6379"

web:
  # Extra origins for the nginx Content-Security-Policy (space separated).
  # Empty keeps the image default: the PostHog EU endpoints. Widen it when
  # analytics lives in another region, or VITE_API_URL points the bundle at an
  # origin other than the one serving it.
  cspExtraOrigins: ""
  image: ghcr.io/your-org/flama-web:latest
  replicas: 1
  port: 3000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi

adminWeb:
  # Extra origins for the nginx Content-Security-Policy (space separated).
  # Empty keeps the image default: the PostHog EU endpoints. Widen it when
  # analytics lives in another region, or VITE_API_URL points the bundle at an
  # origin other than the one serving it.
  cspExtraOrigins: ""
  image: ghcr.io/your-org/flama-admin-web:latest
  replicas: 1
  port: 3000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi

runner:
  image: ghcr.io/your-org/flama-runner:latest
  replicas: 1
  port: 3006
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  # RUNNER_BOOTSTRAP_API_KEY and RUNNER_JWT_SECRET come from the
  # <release>-runner-secrets Secret, never from values.
  env:
    RUNNER_ENV: production
    ERROR_TYPE_BASE_URL: https://docs.flama.dev/errors

docs:
  image: ghcr.io/your-org/flama-docs:latest
  replicas: 1
  port: 80
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

postgres:
  enabled: true
  image: postgres:16-alpine
  storage: 10Gi
  env:
    POSTGRES_USER: flama
    POSTGRES_PASSWORD: flama
    POSTGRES_DB: flama

redis:
  enabled: true
  image: redis:7-alpine
  storage: 1Gi

ingress:
  enabled: true
  className: nginx
  hosts:
    api: api.flama.dev
    web: flama.dev
    adminWeb: control.flama.dev
    docs: docs.flama.dev
  tls:
    enabled: false
